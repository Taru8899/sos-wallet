<!DOCTYPE html>
<html>
<head>
    <title>SOS Wallet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>SOS Wallet</h1>

    <button id="connectButton">
        Connect Wallet
    </button>

    <div class="card">

        <h3>Wallet Address</h3>
        <p id="address">
            Not connected
        </p>

    </div>


    <div class="card">

        <h3>Trust Received</h3>
        <p id="trust">
            0
        </p>

    </div>


    <div class="card">

        <h3>Push Sent</h3>
        <p id="push">
            0
        </p>

    </div>


    <div class="card">

        <h3>Effective Balance</h3>
        <p id="balance">
            0
        </p>

    </div>


    <input 
id="receiver"
placeholder="Receiver address"
/>


<button id="mintButton">
    Mint SOS
</button>


</div>


<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js"></script>

<script src="contract.js"></script>

<script src="app.js"></script>

</body>
</html>
