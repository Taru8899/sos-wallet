<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOS69069 Wallet</title>

<link rel="stylesheet" href="style.css">

</head>



<body>


<div class="container">


<div class="header-row">
  <img src="logo.webp" alt="SOS69069" class="logo-badge">
  <div>
    <h1>SOS69069 Wallet</h1>
    <p class="subtitle">Ethereum Mainnet</p>
  </div>
</div>


<div class="card">


<button id="connectButton">

Connect Wallet

</button>


<p>Status:</p>

<div id="status">

Disconnected

</div>


<p>Wallet:</p>

<div id="address">

-

</div>


</div>




<div class="card">


<h2>SOS Balance</h2>


  <p>

Effective:
<span id="effective">0</span>

</p>

<div style="display:none">
<p>Trust: <span id="trust">0</span></p>
<p>Push: <span id="push">0</span></p>
<p>Total Supply: <span id="totalSupply">0</span></p>
</div>


</div>




<div class="card">


<h2>Mint SOS</h2>

<input
id="receiver"
placeholder="0x1C10e6574ee696f54b21A611a21313E4714628ad"
>

<p class="muted small" style="margin-top:8px">
Mint 1 SOS or more (max 50, one confirmation each)
</p>

<p class="muted small" id="mintProgress"></p>

<input
id="mintCount"
type="number"
min="1"
max="50"
value="1"
>


<button id="mintButton" disabled>
Push SOS To Address
</button>


</div>


<div class="card" style="text-align:center">
  <p style="margin-bottom:12px;color:#9ca3af;font-size:14px">More</p>
  <a href="history.html" style="color:#60a5fa;margin:0 16px;text-decoration:none;font-size:20px;font-weight:800">History</a>
  <a href="offers.html" style="color:#4ade80;margin:0 16px;text-decoration:none;font-size:20px;font-weight:800">Offers</a>
</div>


</div>



<!-- ethers.js v6 is an ES module — must be loaded with type="module"
     and imported, then exposed as window.ethers so contract.js/app.js
     (plain, non-module scripts) can use the global `ethers` object. -->
<script type="module">

    import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js";

    window.ethers = ethers;

</script>


<!-- SOS contract connection -->
<script src="contract.js?v=5"></script>


<!-- UI wiring -->
<script src="app.js?v=5"></script>


</body>

</html>
