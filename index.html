<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOS69069 Wallet</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="header-row">
            <img src="logo.webp" alt="SOS69069" class="logo-badge">
            <div>
                <h1>SOS69069 Wallet</h1>
                <p class="subtitle">Ethereum Mainnet</p>
            </div>
        </div>

        <div class="card" style="margin-bottom:3px">

            <button id="connectButton">
                Connect Wallet
            </button>

            <p style="margin-top:8px">Status:</p>

            <div id="status">
                Disconnected
            </div>

            <p style="margin-top:8px">Wallet:</p>

            <div id="address">
                -
            </div>

        </div>

        <div class="card" style="margin-bottom:3px">

            <h2>SOS Balance</h2>

            <!-- Effective accented in dark blue -->
            <p style="font-size:1.2rem; font-weight:700;">
                Effective:
                <span id="effective" style="color:var(--brand-blue-soft);">0</span>
            </p>

            <!-- Trust, Push, Total Supply — same style as history.html, no "muted small" -->
            <p style="margin-top:8px">
                Trust: <span id="trust">0</span> ·
                Push: <span id="push">0</span> ·
                Total Supply: <span id="totalSupply">0</span>
            </p>

        </div>

        <div class="card">

            <h2>Mint SOS</h2>

            <input id="receiver" placeholder="0x1C10e6574ee696f54b21A611a21313E4714628ad">

            <p style="margin-top:4px;font-weight:700;font-size:17px">
                Mint 1 SOS or more (max 50, one confirmation each)
            </p>

            <p class="muted small" id="mintProgress"></p>

            <input id="mintCount" type="number" min="1" max="50" value="1" style="
            font-weight:700;
            font-size:22px;
            text-align:center;
            border:3px solid #2d8cff;
            border-radius:10px;
            padding:12px;
            background:#0f172a;
            color:white;
            box-shadow:0 0 12px rgba(45,140,255,.35);
            margin-top:6px;
            margin-bottom:10px;
            ">

            <button id="mintButton" disabled>
                Push SOS To Address
            </button>

            <p style="text-align:center;margin-top:12px">
                <a href="history.html" style="color:var(--brand-blue-soft);margin:0 12px;text-decoration:none;font-size:20px;font-weight:700">
                    History
                </a>

                <a href="offers.html" style="color:var(--brand-green-bright);margin:0 12px;text-decoration:none;font-size:20px;font-weight:700">
                    Offers
                </a>
            </p>

        </div>

    </div>

    <!-- ethers.js v6 -->
    <script type="module">
        import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js";
        window.ethers = ethers;
    </script>

    <!-- SOS contract -->
    <script src="contract.js?v=5"></script>

    <!-- UI -->
    <script src="app.js?v=5"></script>

</body>

</html>
