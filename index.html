<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS69069 Wallet</title>

    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0e14;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 2px;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .card {
            background: #141a24;
            border-radius: 20px;
            padding: 24px 22px;
            margin-bottom: 18px;
            border: 1px solid #1f2937;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: border-color 0.15s;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f0f2f5;
            letter-spacing: -0.2px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.6;
            color: #d1d5db;
        }

        .card p span {
            font-weight: 500;
            color: #f0f2f5;
        }

        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s, transform 0.05s;
            letter-spacing: 0.2px;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* status / address pills */
        #status,
        #address {
            background: #1f2937;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            word-break: break-all;
            margin-top: 4px;
            color: #d1d5db;
            border: 1px solid #2d3748;
        }

        #address {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            color: #93c5fd;
        }

        /* mint form */
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            background: #0f172a;
            color: #e5e7eb;
            font-size: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input[type="number"] {
            font-family: inherit;
            max-width: 120px;
        }

        .muted {
            color: #6b7280;
            font-size: 13px;
        }
        .small {
            font-size: 13px;
        }

        #mintProgress {
            min-height: 22px;
            color: #60a5fa;
            font-weight: 500;
            margin-top: 6px;
        }

        /* inline helper row */
        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .row input[type="number"] {
            flex: 0 0 auto;
        }
        .row label {
            margin-bottom: 0;
        }

        /* "More" nav */
        .more-nav {
            display: flex;
            justify-content: center;
            gap: 28px;
            padding-top: 6px;
        }
        .more-nav a {
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: opacity 0.15s;
        }
        .more-nav a:hover {
            opacity: 0.7;
        }
        .more-nav a.history {
            color: #60a5fa;
        }
        .more-nav a.offers {
            color: #4ade80;
        }

        .creator-badge {
            font-size: 12px;
            color: #6b7280;
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 6px;
        }
        .creator-badge code {
            color: #93c5fd;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
        }

        /* responsive */
        @media (max-width: 480px) {
            .card {
                padding: 18px 16px;
            }
            h1 {
                font-size: 24px;
            }
            .more-nav a {
                font-size: 17px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>SOS69069 Wallet</h1>
        <p class="subtitle">Ethereum Mainnet</p>

        <!-- ─── connect card ─── -->
        <div class="card">

            <button id="connectButton">Connect Wallet</button>

            <p style="margin-top:14px;">Status:</p>
            <div id="status">Disconnected</div>

            <p style="margin-top:14px;">Wallet:</p>
            <div id="address">-</div>

        </div>

        <!-- ─── balance card ─── -->
        <div class="card">

            <h2>SOS Balance</h2>

            <p>Trust: <span id="trust">0</span></p>
            <p>Push: <span id="push">0</span></p>
            <p>Effective: <span id="effective">0</span></p>
            <p>Total Supply: <span id="totalSupply">0</span></p>

        </div>

        <!-- ─── mint card ─── -->
        <div class="card">

            <h2>Mint SOS</h2>

            <label for="receiver">Address to send SOS to</label>
            <input
            id="receiver"
            placeholder="0x… address to send SOS to"
            >

            <div style="margin-top:16px;">
                <label for="mintCount">How many</label>
                <input
                id="mintCount"
                type="number"
                min="1"
                max="50"
                value="1"
                style="max-width:120px;"
                >
            </div>

            <button id="mintButton" disabled style="margin-top:14px;">
                Push SOS
            </button>

            <p class="muted small" style="margin-top:10px;">
                Mint 1 SOS or more (max 50, one confirmation each)
            </p>

            <p class="muted small" id="mintProgress"></p>

            <div class="creator-badge">
                ⚡ default: mint to <code>0x1C10e6574ee696f54b21A611a21313E4714628ad</code>
            </div>

        </div>

        <!-- ─── more nav ─── -->
        <div class="card" style="text-align:center;padding:16px 16px 14px;">
            <p style="margin-bottom:10px;color:#6b7280;font-size:14px;">More</p>
            <div class="more-nav">
                <a href="history.html" class="history">History</a>
                <a href="offers.html" class="offers">Offers</a>
            </div>
        </div>

    </div>

    <!-- ─── ethers.js v6 (ESM) ─── -->
    <script type="module">
        import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js";
        window.ethers = ethers;
    </script>

    <!-- ─── SOS contract connection ─── -->
    <script src="contract.js?v=5"></script>

    <!-- ─── app logic ─── -->
    <script>
        // ── constants ──
        const CREATOR_ADDRESS = "0x1C10e6574ee696f54b21A611a21313E4714628ad";

        let walletAddress = "";

        const connectButton = document.getElementById("connectButton");
        const mintButton = document.getElementById("mintButton");

        mintButton.disabled = true;

        // ── connect ──
        connectButton.onclick = async function() {

            try {

                document.getElementById("status").innerText = "Connecting…";

                walletAddress = await connectWallet();

                document.getElementById("address").innerText = walletAddress;

                // ── pre‑fill the receiver field with the CREATOR address ──
                const receiverInput = document.getElementById("receiver");
                if (receiverInput) {
                    receiverInput.value = CREATOR_ADDRESS;
                }

                await refreshWallet();

                mintButton.disabled = false;

                document.getElementById("status").innerText = "Connected";

            } catch (err) {

                console.error(err);
                document.getElementById("status").innerText = err.message;

            }

        };

        // ── refresh ──
        async function refreshWallet() {

            console.log("Loading SOS data");
            console.log("Contract:", contract);
            console.log("Current wallet:", walletAddress);

            const trust = await getTrust(walletAddress);
            const push = await getPushCount(walletAddress);
            const total = await getTotalSupply();

            document.getElementById("trust").innerText = trust.toString();
            document.getElementById("push").innerText = push.toString();
            document.getElementById("effective").innerText = (BigInt(trust) - BigInt(push)).toString();
            document.getElementById("totalSupply").innerText = total.toString();

        }

        // ── mint ──
        mintButton.onclick = async function() {

            const progressEl = document.getElementById("mintProgress");
            const receiverRaw = document.getElementById("receiver").value.trim();
            const n = parseInt(document.getElementById("mintCount").value, 10) || 1;

            // If the field is empty → treat as "mint to yourself"
            // But we always pre‑fill the creator address, so this is a fallback.
            const isSelf = !receiverRaw ||
                (walletAddress && receiverRaw.toLowerCase() === walletAddress.toLowerCase());

            const receiver = isSelf ? null : receiverRaw;

            if (!isSelf) {
                if (!/^0x[a-fA-F0-9]{40}$/.test(receiver)) {
                    alert("Enter a valid Ethereum address (0x…) or leave blank to mint to yourself.");
                    return;
                }
            }

            if (n < 1) {
                alert("Enter how many SOS to mint (1 or more).");
                return;
            }

            if (n > 50) {
                alert("Max 50 per batch — that's already 50 separate wallet confirmations.");
                return;
            }

            if (n > 5) {
                const ok = confirm(
                    "This will ask you to confirm " + n + " separate wallet transactions, one at a time, " +
                    "and each one costs its own gas fee. Continue?"
                );
                if (!ok) return;
            }

            mintButton.disabled = true;
            let completed = 0;

            for (let i = 1; i <= n; i++) {

                if (n === 1) {
                    document.getElementById("status").innerText = "Waiting for wallet confirmation…";
                    progressEl.innerText = "";
                } else {
                    progressEl.innerText = "Minting " + i + " of " + n + "… confirm in your wallet";
                    document.getElementById("status").innerText = "Minting " + i + " of " + n + "…";
                }

                try {

                    if (isSelf) {
                        await pushForMe();
                    } else {
                        await pushTo(receiver);
                    }

                    completed++;

                    if (n > 1) {
                        progressEl.innerText = completed + " of " + n + " confirmed ✓";
                    }

                    await refreshWallet();

                } catch (err) {

                    console.error(err);

                    const msg = err.shortMessage || err.message;

                    if (n > 1) {
                        progressEl.innerText =
                            "Stopped after " + completed + " of " + n + " — " + msg;
                        document.getElementById("status").innerText =
                            "Batch mint stopped: " + msg;
                    } else {
                        document.getElementById("status").innerText = msg;
                        progressEl.innerText = "";
                    }

                    mintButton.disabled = false;
                    return;

                }

            }

            if (n === 1) {
                document.getElementById("status").innerText =
                    isSelf ? "Self Push Successful" : "Mint Successful";
                progressEl.innerText = "";
            } else {
                document.getElementById("status").innerText =
                    "Batch mint complete — " + completed + " SOS minted";
            }

            mintButton.disabled = false;

        };
    </script>

</body>

</html>
